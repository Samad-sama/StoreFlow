<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071E3"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="110" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="34" y="34" width="444" height="444" rx="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="3" />

  <!-- Store Roof / Canopy Arc -->
  <path d="M 140 180 C 140 160, 160 145, 185 145 L 327 145 C 352 145, 372 160, 372 180 L 372 210 C 372 225, 355 235, 340 235 C 325 235, 310 220, 295 235 C 280 250, 265 235, 256 235 C 247 235, 232 250, 217 235 C 202 220, 187 235, 172 235 C 157 235, 140 225, 140 210 Z" fill="#FFFFFF" fill-opacity="0.95" />

  <!-- Modern Store Body & Flow Arrow -->
  <rect x="165" y="240" width="182" height="135" rx="18" fill="#FFFFFF" fill-opacity="0.95" />

  <!-- Door / Terminal Screen cutout -->
  <rect x="220" y="280" width="72" height="95" rx="10" fill="url(#bgGrad)" />

  <!-- Modern Dynamic Currency / Flow Wave -->
  <path d="M 125 385 Q 256 430 387 385" fill="none" stroke="#60A5FA" stroke-width="14" stroke-linecap="round" />
  <path d="M 155 410 Q 256 450 357 410" fill="none" stroke="#93C5FD" stroke-width="8" stroke-linecap="round" stroke-opacity="0.75" />
</svg>
