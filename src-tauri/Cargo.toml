[package]
name = "storeflow"
version = "1.0.0"
description = "StoreFlow Universal Store Management"
authors = ["StoreFlow Team <support@storeflow.app>"]
edition = "2021"

[lib]
name = "storeflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
